<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bladeEdge" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="guardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hiltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#1e1b18"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="swordGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGlow)" />

  <!-- Shield / Crest Outline -->
  <path d="M64 8 L108 26 C108 68 88 104 64 120 C40 104 20 68 20 26 Z" 
        fill="#0c1017" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.6"/>

  <path d="M64 14 L102 30 C102 66 84 98 64 112 C44 98 26 66 26 30 Z" 
        fill="#070a0e" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Golden Crown Above Sword -->
  <path d="M50 32 L54 38 L64 30 L74 38 L78 32 L82 46 L46 46 Z" 
        fill="url(#guardGrad)" stroke="#fef08a" stroke-width="1.2" filter="url(#swordGlow)"/>
  <circle cx="50" cy="31" r="1.8" fill="#fef08a"/>
  <circle cx="64" cy="29" r="2.2" fill="#fff"/>
  <circle cx="78" cy="31" r="1.8" fill="#fef08a"/>

  <!-- Sword Blade (Diagonal from top-right to center) -->
  <g filter="url(#swordGlow)">
    <!-- Blade Body -->
    <path d="M64 42 L67 47 L67 82 L64 87 L61 82 L61 47 Z" fill="url(#bladeGrad)"/>
    <!-- Blade Ridge Center -->
    <line x1="64" y1="42" x2="64" y2="86" stroke="url(#bladeEdge)" stroke-width="1.5"/>

    <!-- Crossguard -->
    <path d="M48 84 L80 84 L84 89 L80 92 L48 92 L44 89 Z" fill="url(#guardGrad)" stroke="#fef08a" stroke-width="0.8"/>
    <!-- Guard Side Spikes -->
    <polygon points="44,89 40,86 44,84" fill="#fbbf24"/>
    <polygon points="84,89 88,86 84,84" fill="#fbbf24"/>

    <!-- Central Guard Gem (Emerald) -->
    <polygon points="64,85 67,88 64,91 61,88" fill="url(#gemGrad)" stroke="#6ee7b7" stroke-width="0.8"/>

    <!-- Handle / Grip -->
    <rect x="62" y="92" width="4" height="14" rx="1" fill="url(#hiltGrad)" stroke="#78350f" stroke-width="0.8"/>
    <!-- Grip wraps -->
    <line x1="62" y1="95" x2="66" y2="96" stroke="#d97706" stroke-width="0.8"/>
    <line x1="62" y1="99" x2="66" y2="100" stroke="#d97706" stroke-width="0.8"/>
    <line x1="62" y1="103" x2="66" y2="104" stroke="#d97706" stroke-width="0.8"/>

    <!-- Pommel -->
    <circle cx="64" cy="108" r="4.5" fill="url(#guardGrad)" stroke="#fef08a" stroke-width="1"/>
    <circle cx="64" cy="108" r="2" fill="url(#gemGrad)"/>
  </g>

  <!-- Sparkles -->
  <polygon points="40,54 42,50 44,54 48,56 44,58 42,62 40,58 36,56" fill="#fef08a" opacity="0.85"/>
  <polygon points="88,62 89,59 91,62 94,63 91,64 89,67 88,64 85,63" fill="#fef08a" opacity="0.85"/>
</svg>
